name: Gateway and firmware quality checks
on:
  push: { branches: [master] }
  pull_request: { branches: [master] }
permissions: { contents: read }
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - run: python -m pip install --require-hashes -r raspberry-pi/requirements.txt
      - run: python -m pip install platformio==6.2.0
      - name: Audit gateway dependency tree
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r raspberry-pi/requirements.txt --strict --progress-spinner off
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s raspberry-pi/tests -v
      - name: Verify MQTT outage and restart recovery with a real broker
        run: |
          printf '%s\n' 'listener 1883 0.0.0.0' 'allow_anonymous true' 'persistence false' > "$RUNNER_TEMP/mosquitto.conf"
          docker run --detach --rm --name telemetry-test -p 127.0.0.1:18884:1883 -v "$RUNNER_TEMP/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
          trap 'docker stop telemetry-test' EXIT
          MQTT_TEST_PORT=18884 PYTHONDONTWRITEBYTECODE=1 python raspberry-pi/tests/mqtt_delivery_probe.py
      - run: pio run --project-dir esp32-wrover --environment compile-check
